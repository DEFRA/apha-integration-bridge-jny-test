name: Run APHA Integration Bridge Journey Tests

description: Run the APHA Integration Bridge API journey tests and upload the HTML report

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Setup the tests
      run: npm ci
      shell: bash
    - name: Run repository checks
      run: npm run format:check && npm run lint && npm run test:unit
      shell: bash
    - name: Run the tests
      id: journeys
      continue-on-error: true
      shell: bash
      run: npm run test:github
    - name: Generate HTML report
      if: always()
      shell: bash
      run: npm run report
    - name: Upload HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: ./allure-report
    - name: Preserve journey failure status
      if: steps.journeys.outcome == 'failure'
      shell: bash
      run: exit 1
